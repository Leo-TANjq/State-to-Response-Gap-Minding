[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deco-humanlm"
version = "0.1.0"
description = "Structured response rewards for personalized user simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "litellm>=1.60",
  "numpy>=1.26",
]

[project.optional-dependencies]
generation = [
  "pandas>=2.1",
  "peft>=0.14",
  "pyarrow>=15",
  "torch>=2.4",
  "transformers>=4.51",
]
embedding = [
  "sentence-transformers>=3.3",
  "torch>=2.4",
]
dev = [
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
